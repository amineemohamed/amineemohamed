<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b161c"/><stop offset=".6" stop-color="#16303b"/><stop offset="1" stop-color="#1f6f84"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C9FB7"/><stop offset="1" stop-color="#3ECF8E"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ECF8E"/><stop offset="1" stop-color="#2C9FB7" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-width=".6" opacity=".07"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.mono{font-family:'Fira Code',Consolas,monospace}
.sans{font-family:'Segoe UI',Arial,sans-serif}
.cm{font-size:15px;fill:#3ECF8E}
.n1{font-size:46px;font-weight:800;fill:#fff;animation:rise 1s .2s backwards}
.n2{font-size:46px;font-weight:800;fill:url(#nm);animation:rise 1s .5s backwards}
.sb{font-size:17px;fill:#cfe9f0;letter-spacing:1px;animation:rise 1s .9s backwards}
@keyframes rise{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.chip{fill:#fff;fill-opacity:.09;stroke:#a9e4f0;stroke-opacity:.55;stroke-width:1.3}
.ct{font-size:13px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central}
.ed{stroke:#a9e4f0;stroke-width:1;opacity:.22}
.nd{fill:#16303b;stroke:#2C9FB7;stroke-width:2.2;animation:np 3s ease-in-out infinite}
@keyframes np{0%,100%{stroke:#2C9FB7}50%{stroke:#3ECF8E}}
.gm{animation:gm 14s linear infinite}@keyframes gm{to{transform:translate(40px,40px)}}
</style>
<rect width="1000" height="300" fill="url(#bg)"/>
<g class="gm"><rect x="-40" y="-40" width="1100" height="380" fill="url(#grid)"/></g>
<rect x="0" y="292" width="1000" height="8" fill="url(#bar)"/>
